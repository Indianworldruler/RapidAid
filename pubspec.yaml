name: rapidaid
description: A Flutter emergency assistance application.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.0
  firebase_database: ^12.0.4

  # Local device storage
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5

  # Internet connectivity
  connectivity_plus: ^7.0.0
  url_launcher: ^6.3.2
  flutter_phone_direct_caller: ^2.2.1

  # Location and automatic SMS
  geolocator: ^14.1.1
  send_message: ^1.0.2
  permission_handler: ^12.0.1

  # App launcher icon
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "rapidAid_icon.png"
  adaptive_icon_background: "#E53935"
  adaptive_icon_foreground: "rapidAid_icon.png"